---
- name: Set sshd options
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    regexp: "^#?{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    validate: "/usr/sbin/sshd -t -f %s"
    backup: true
  loop:
    - key: PermitRootLogin
      value: prohibit-password
    - key: PasswordAuthentication
      value: "no"
    - key: PubkeyAuthentication
      value: "yes"
    - key: MaxAuthTries
      value: "3"
    - key: X11Forwarding
      value: "no"
  notify: Reload sshd

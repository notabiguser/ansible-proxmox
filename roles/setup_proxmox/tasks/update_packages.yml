- name: Update APT cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # seconds
    upgrade: dist

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Clean old APT package cache
  ansible.builtin.apt:
    autoclean: true
